# Desktop app (desktop/): build the installers on Windows, macOS and Linux, then publish them.
#   Release:  set "version" in desktop/package.json, commit, then  git tag desktop-vX.Y.Z && git push Hadith desktop-vX.Y.Z
#   Test run: Actions → Desktop app → Run workflow (builds only; nothing is published).
# Publishing puts the installers on a GitHub Release and on R2 (https://files.hadith.dev/desktop/), which is where
# the apps look for updates (latest*.yml) and where hadith.dev/offline finds its download links (latest.json).
# Needs the repository secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (see docs/desktop.md).
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  pull_request:                 # builds only, to check a change on all three platforms
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"; have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME but desktop/package.json says $have"; exit 1; fi
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned until signing is set up (docs/desktop.md)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out/desktop
          merge-multiple: true
      - name: latest.json (download links for hadith.dev/offline)
        run: node desktop/scripts/write-latest-json.mjs out/desktop "$GITHUB_REF_NAME"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/desktop/* \
            --title "الجامع لسطح المكتب ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Windows: .exe · macOS: .dmg (Apple silicon: arm64, Intel: x64) · Linux: .AppImage / .deb"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload to R2 (installers first, update files last)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then echo "::warning::R2 secrets not set: published on GitHub only, apps will not see this update"; exit 0; fi
          pip install --quiet boto3
          python scripts/r2-upload.py out/desktop desktop/
