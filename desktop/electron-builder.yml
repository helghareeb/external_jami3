# Desktop installers for hadith.dev (Windows, macOS, Linux). See docs/desktop.md.
# appId is permanent once a version has shipped: it identifies the app for updates and the OS.
appId: dev.hadith.desktop
productName: Hadith
copyright: hadith.dev
artifactName: hadith-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - pages/**
  - package.json

compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]           # one installer; Windows on ARM runs it too

nsis:
  oneClick: true          # one click, no questions: installs for this user, no admin rights needed
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: الجامع — hadith.dev
  deleteAppDataOnUninstall: false   # keeps the downloaded database if the app is reinstalled

# Microsoft Store package (npm run build:store → .appx): identity from Partner Center (docs/desktop.md, product
# 9N4K0S7PR212). Microsoft signs it on submission. The Store updates it, so its own updater is off (main.js).
appx:
  identityName: Hadith.dev.301807AF58428
  publisher: CN=1158820C-79CC-43D8-A05D-31DB3A1E5674
  publisherDisplayName: Hadith.dev
  displayName: الجامع موسوعة الحديث
  applicationId: Hadith
  backgroundColor: "#103D2E"
  languages: [ar-SA, en-US]
  showNameOnTiles: true
  artifactName: hadith-${version}-store-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip           # electron-updater on macOS updates from the zip
      arch: [x64, arm64]
  category: public.app-category.education
  identity: null            # unsigned until there is an Apple Developer account: no auto-update on macOS yet

dmg:
  title: الجامع — hadith.dev

linux:
  target:
    - target: AppImage      # auto-updates
      arch: [x64]
    - target: deb           # updated by downloading the new .deb
      arch: [x64]
  category: Education
  synopsis: موسوعة الحديث — hadith.dev
  maintainer: hadith.dev

# Updates: electron-updater reads latest.yml / latest-mac.yml / latest-linux.yml from here.
publish:
  provider: generic
  url: https://files.hadith.dev/desktop
