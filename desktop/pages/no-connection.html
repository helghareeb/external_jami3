<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>الجامع — لا يوجد اتصال</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1f2a24; --muted: #5f6b64; --primary: #1d5c3f; --card: #ffffff; --border: #e3e0d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --fg: #e8ece9; --muted: #a3ada7; --primary: #6fbf95; --card: #1b201d; --border: #2c332f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  .card { max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.7; margin: 0 0 16px; }
  button { background: var(--primary); color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لم تُحمَّل الموسوعة على هذا الجهاز بعد. عند عودة الاتصال افتح «الجامع دون إنترنت» من القائمة وحمّلها مرة واحدة، ثم يعمل التطبيق دون إنترنت.</p>
    <button id="retry" type="button">إعادة المحاولة</button>
  </div>
</main>
<script>
  const to = new URLSearchParams(location.search).get('to') || 'https://hadith.dev/'
  const go = () => { if (/^https:\/\/(www\.)?hadith\.dev(\/|$)/.test(to)) location.href = to }
  document.getElementById('retry').addEventListener('click', go)
  window.addEventListener('online', go)
</script>
</body>
</html>
